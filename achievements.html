<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .ach-count { font-family: var(--display); font-size: 0.75rem; color: var(--gold); margin: 0 0 1.5rem; }
  .ach-list { list-style: none; margin: 0; padding: 0; }
  .ach-list li { display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.9rem; padding: 0.9rem 0; border-top: 1px dashed var(--edge-2); }
  .ach-list li:last-child { border-bottom: 1px dashed var(--edge-2); }
  .ach-list .mark { font-family: var(--display); color: var(--muted); }
  .ach-list li.done .mark { color: var(--gold); }
  .ach-list .name { font-family: var(--display); font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 0.3rem; }
  .ach-list li.done .name { color: var(--text); }
  .ach-list .desc { color: var(--muted); }
  .ach-list li:not(.done) .desc { filter: blur(3px); user-select: none; }
</style>
</head>
<body data-bg="sheet">

<nav class="topline" aria-label="Sections">
  <a href="index.html">&larr; TITLE SCREEN</a>
</nav>

<main class="screen">
  <h1>ACHIEVEMENTS</h1>
  <p class="ach-count" id="count">0 / 0 unlocked</p>
  <div class="box">
    <ul class="ach-list" id="list"></ul>
  </div>
</main>

<script src="fx.js"></script>
<script>
  (function () {
    var data = window.FX ? { ACH: FX.ACH, got: FX.read() } : { ACH: {}, got: {} };
    var ids = Object.keys(data.ACH);
    var done = ids.filter(function (id) { return data.got[id]; }).length;
    document.getElementById('count').textContent = done + ' / ' + ids.length + ' unlocked';
    var ul = document.getElementById('list');
    ids.forEach(function (id) {
      var a = data.ACH[id], has = !!data.got[id];
      var li = document.createElement('li');
      if (has) li.className = 'done';
      li.innerHTML =
        '<span class="mark">' + (has ? '★' : '☆') + '</span>' +
        '<span><span class="name">' + (has ? a[0] : 'LOCKED') + '</span>' +
        '<span class="desc">' + a[1] + '</span></span>';
      ul.appendChild(li);
    });
  })();
</script>
</body>
</html>
