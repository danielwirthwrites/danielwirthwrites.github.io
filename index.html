<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060f">
<title>Daniel Wirth</title>
<meta name="description" content="Daniel Wirth's author site, presented as a video game title screen. A writer-type adventure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  body { overflow-x: hidden; }
  .title-wrap {
    position: relative; z-index: 1; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 3rem 1.5rem;
  }
  #fx-stars { position: fixed; inset: 0; z-index: 0; }
  .logo {
    font-family: var(--display); font-size: clamp(1.8rem, 8vw, 3.4rem); line-height: 1.5;
    color: var(--gold); text-shadow: 4px 4px 0 var(--edge-2), 4px 4px 0 3px #05060f;
    margin: 0 0 0.6rem;
  }
  .tagline { font-family: var(--body); font-size: 1.6rem; color: var(--muted); margin: 0 0 3rem; }
  .press-start {
    font-family: var(--display); font-size: 0.85rem; color: var(--text);
    margin: 2.5rem 0 0; animation: blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) { .press-start { animation: none; } }
  @keyframes blink { 50% { opacity: 0; } }

  .title-menu { text-align: left; display: inline-block; }
  .title-menu .box { min-width: 18rem; }

  .copyright { font-family: var(--display); font-size: 0.55rem; color: var(--dim); margin-top: 2.5rem; }
</style>
</head>
<body data-bg="stars">

<canvas id="fx-stars" aria-hidden="true"></canvas>

<div class="title-wrap">
  <h1 class="logo">DANIEL<br>WIRTH</h1>
  <p class="tagline">A Writer-Type Adventure</p>

  <nav class="title-menu" aria-label="Main menu">
    <div class="box">
      <ul class="menu">
        <li><a href="about.html">NEW GAME<span class="sub">— read the character sheet</span></a></li>
        <li><a href="books.html">CONTINUE<span class="sub">— load a save (the books)</span></a></li>
        <li><a href="notebook.html">QUEST LOG<span class="sub">— work in progress</span></a></li>
        <li><a href="contact.html">OPTIONS<span class="sub">— talk to Daniel</span></a></li>
      </ul>
    </div>
  </nav>

  <p class="press-start">PRESS START</p>
  <p class="copyright">&copy; 2026 DANIEL WIRTH &middot; <a href="achievements.html">ACHIEVEMENTS</a></p>
</div>

<script src="fx.js"></script>
</body>
</html>
