<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060f">
<title>Daniel Wirth</title>
<meta name="description" content="Daniel Wirth's author site, presented as a video game title screen. A writer-type adventure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  body { overflow-x: hidden; }
  .title-wrap {
    position: relative; z-index: 1; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 3rem 1.5rem;
  }
  #fx-stars { position: fixed; inset: 0; z-index: 0; }
  .logo {
    font-family: var(--display); font-size: clamp(1.8rem, 8vw, 3.4rem); line-height: 1.5;
    color: var(--gold); text-shadow: 4px 4px 0 var(--edge-2), 4px 4px 0 3px #05060f;
    margin: 0 0 0.6rem;
  }
  .tagline { font-family: var(--body); font-size: 1.6rem; color: var(--muted); margin: 0 0 3rem; }
  .press-start {
    font-family: var(--display); font-size: 0.85rem; color: var(--text);
    margin: 2.5rem 0 0; animation: blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) { .press-start { animation: none; } }
  @keyframes blink { 50% { opacity: 0; } }

  .title-menu { text-align: left; display: inline-block; }
  .title-menu .box { min-width: 18rem; }

  .or { font-family: var(--display); font-size: 0.65rem; color: var(--dim); margin: 1.75rem 0; }

  .term { text-align: left; width: 100%; max-width: 22rem; cursor: text; }
  .term-log {
    max-height: 9rem; overflow-y: auto; margin: 0 0 0.8rem;
    font-family: var(--body); font-size: 1.25rem; line-height: 1.35; color: var(--ok);
  }
  .term-log p { margin: 0 0 0.25rem; word-break: break-word; }
  .term-log .err { color: var(--danger); }
  .term-log .go { color: var(--gold); }
  .term-row { display: flex; align-items: center; gap: 0.5rem; border-top: 1px dashed var(--edge-2); padding-top: 0.7rem; }
  .term-row .prompt { font-family: var(--body); font-size: 1.35rem; color: var(--ok); }
  .term-input {
    flex: 1; background: none; border: 0; outline: 0; color: var(--ok);
    font-family: var(--body); font-size: 1.35rem; caret-color: var(--gold);
  }

  .copyright { font-family: var(--display); font-size: 0.55rem; color: var(--dim); margin-top: 2.5rem; }
</style>
</head>
<body data-bg="stars">

<canvas id="fx-stars" aria-hidden="true"></canvas>

<div class="title-wrap">
  <h1 class="logo">DANIEL<br>WIRTH</h1>
  <p class="tagline">A Writer-Type Adventure</p>

  <nav class="title-menu" aria-label="Main menu">
    <div class="box">
      <ul class="menu">
        <li><a href="about.html">NEW GAME<span class="sub">— read the character sheet</span></a></li>
        <li><a href="books.html">CONTINUE<span class="sub">— load a save (the books)</span></a></li>
        <li><a href="notebook.html">QUEST LOG<span class="sub">— work in progress</span></a></li>
        <li><a href="contact.html">OPTIONS<span class="sub">— talk to Daniel</span></a></li>
      </ul>
    </div>
  </nav>

  <p class="or">— OR —</p>

  <div class="box term" id="term">
    <div class="term-log" id="termLog" aria-live="polite"></div>
    <form class="term-row" id="termForm" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input type="text" id="termInput" class="term-input" aria-label="Type a command"
             autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command...">
    </form>
  </div>

  <p class="press-start">PRESS START</p>
  <p class="copyright">&copy; 2026 DANIEL WIRTH &middot; <a href="achievements.html">ACHIEVEMENTS</a></p>
</div>

<script src="fx.js"></script>
<script>
(function () {
  var log = document.getElementById('termLog');
  var form = document.getElementById('termForm');
  var input = document.getElementById('termInput');
  var box = document.getElementById('term');
  if (!form) return;

  var routes = {
    status: 'about.html', character: 'about.html', sheet: 'about.html', bio: 'about.html',
    about: 'about.html', stats: 'about.html', skills: 'about.html', newgame: 'about.html',
    inventory: 'books.html', books: 'books.html', book: 'books.html', shop: 'books.html',
    items: 'books.html', item: 'books.html', buy: 'books.html', continue: 'books.html',
    quest: 'notebook.html', quests: 'notebook.html', log: 'notebook.html', notebook: 'notebook.html',
    wip: 'notebook.html', progress: 'notebook.html',
    talk: 'contact.html', contact: 'contact.html', npc: 'contact.html', email: 'contact.html',
    options: 'contact.html', settings: 'contact.html',
    achievements: 'achievements.html', achievement: 'achievements.html',
    trophies: 'achievements.html', unlocks: 'achievements.html'
  };

  function print(text, cls) {
    var p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  function boot() {
    var lines = ['SYSTEM BOOT ... OK', 'LOADING DANIEL_WIRTH.EXE ... OK', 'TYPE A COMMAND. TRY "HELP".'];
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { lines.forEach(function (l) { print(l); }); return; }
    var i = 0;
    (function next() {
      if (i >= lines.length) return;
      print(lines[i++]);
      setTimeout(next, 320);
    })();
  }
  boot();

  function run(raw) {
    var cmd = raw.trim().toLowerCase().replace(/[^a-z0-9 ]/g, '');
    print('> ' + raw);
    if (!cmd) return;

    if (cmd === 'help' || cmd === 'commands' || cmd === '?') {
      print('TRY: STATUS / INVENTORY / QUESTS / TALK / ACHIEVEMENTS', 'go');
      return;
    }
    if (cmd === 'look' || cmd === 'look around') {
      print('A TITLE SCREEN. A MENU. A CURSOR, BLINKING, WAITING ON YOU.', 'go');
      return;
    }
    if (/^(hi|hello|hey)\b/.test(cmd)) {
      print('HELLO. THIS IS A WEBSITE, NOT A CHATBOT. TRY "HELP".', 'go');
      return;
    }

    var dest = routes[cmd];
    if (!dest) {
      var words = cmd.split(/\s+/);
      for (var i = 0; i < words.length && !dest; i++) dest = routes[words[i]];
    }
    if (dest) {
      print('LOADING ' + dest.replace('.html', '').toUpperCase() + ' ...', 'go');
      window.FX && FX.unlock('typist');
      setTimeout(function () { window.location.href = dest; }, 480);
    } else {
      print('COMMAND NOT RECOGNIZED. TYPE "HELP".', 'err');
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    run(v);
  });
  box.addEventListener('click', function () { input.focus(); });
})();
</script>
</body>
</html>
